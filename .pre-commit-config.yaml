repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: check-ast
  - id: check-executables-have-shebangs
  - id: check-json
  - id: check-merge-conflict
  - id: check-yaml
  - id: end-of-file-fixer
  - id: fix-byte-order-marker
  - id: requirements-txt-fixer
- repo: https://github.com/pycqa/isort
  rev: 6.0.1
  hooks:
  - id: isort
    args: [--profile, black]
- repo: https://github.com/psf/black
  rev: 25.1.0
  hooks:
  - id: black
    args:
    - --line-length=100
    - --workers=1

- repo: https://github.com/sourcery-ai/sourcery
  rev: v1.36.0
  hooks:
  - id: sourcery
    # Sourcery suggestions are advisory and may return a non-zero status when
    # refactors are available. Run them explicitly with:
    # pre-commit run --hook-stage manual sourcery --all-files
    stages: [manual]
    args: [--no-summary]
