name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / Streamlit ${{ matrix.streamlit-version }} / Supabase ${{ matrix.supabase-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        streamlit-version: ["1.62.0", "latest"]
        supabase-version: ["latest"]
        include:
          - python-version: "3.10"
            streamlit-version: "1.62.0"
            supabase-version: "2.22.0"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install the package with minimum Streamlit
        if: matrix.streamlit-version != 'latest'
        run: >-
          python -m pip install --editable .
          "streamlit==${{ matrix.streamlit-version }}"

      - name: Install the package with latest Streamlit
        if: matrix.streamlit-version == 'latest'
        run: python -m pip install --upgrade --editable . streamlit

      - name: Install minimum supported Supabase
        if: matrix.supabase-version != 'latest'
        # Supabase 2.22.0 leaves component versions unbounded; test its matching SDK cohort.
        run: >-
          python -m pip install
          "supabase==${{ matrix.supabase-version }}"
          "postgrest==${{ matrix.supabase-version }}"
          "storage3==${{ matrix.supabase-version }}"
          "supabase-auth==${{ matrix.supabase-version }}"
          "supabase-functions==${{ matrix.supabase-version }}"
          "realtime==${{ matrix.supabase-version }}"

      - name: Show resolved versions
        run: python -m pip show st-supabase-connection streamlit supabase

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Run library and demo tests
        run: python -m unittest discover --start-directory tests --verbose

  package:
    name: Build and install package
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Install the built wheel
        run: python -m pip install --force-reinstall dist/*.whl

      - name: Smoke-test the installed public API
        run: |
          cd "${RUNNER_TEMP}"
          python -c "import importlib.metadata as metadata; import st_supabase_connection as package; from st_supabase_connection import SupabaseConnection, execute_query; assert metadata.version('st-supabase-connection') == package.__version__; print(f'Installed st-supabase-connection {package.__version__}')"

  demo:
    name: Pinned demo runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the deployed dependency set
        run: python -m pip install -r demo/requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run library and demo tests
        run: python -m unittest discover --start-directory tests --verbose
